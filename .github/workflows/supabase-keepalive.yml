name: Supabase Keepalive

# Prevents the Supabase free-tier project from being paused after 7 days
# of database inactivity. Runs a trivial read query every hour.
#
# GitHub also disables scheduled workflows in public repos after 60 days
# without repository activity. The workflow-keepalive job re-enables this
# workflow through the API on every run, which resets that timer.

on:
  schedule:
    - cron: '17 * * * *'      # every hour at :17 past
  workflow_dispatch:          # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: main         # SUPABASE_URL / SUPABASE_KEY are environment secrets
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TABLE: matches
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_KEY resolved empty - check the 'main' environment secrets"
            exit 1
          fi

          status=$(curl -sS -o /tmp/out.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY") || status="000"

          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/out.txt
          echo ""

          if [ "$status" -ne 200 ]; then
            echo "::error::Keepalive ping failed with HTTP $status - the project is NOT protected from pausing"
            exit 1
          fi

          echo "Keepalive ping succeeded - database activity registered"

  workflow-keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write          # required to call the enable-workflow endpoint
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/enable"
          echo "Workflow $workflow_id re-enabled - 60-day inactivity timer reset"
