
name: Supabase Keepalive
 
# Prevents the Supabase free-tier project from being paused after 7 days
# of database inactivity. Runs a trivial read query twice a week.
 
on:
  schedule:
    - cron: '17 6 * * 1,3,5'   # Mondays, Wednesdays, and Fridays, 06:17 UTC
  workflow_dispatch:          # allows manual runs from the Actions tab
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABLE:i matches
        run: |
          status=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
 
          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/out.txt
          echo ""
 
          if [ "$status" -ne 200 ]; then
            echo "::error::Keepalive ping failed with HTTP $status - the project is NOT protected from pausing"
            exit 1
          fi
 
          
