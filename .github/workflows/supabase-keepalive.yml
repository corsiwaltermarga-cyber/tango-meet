name: Supabase Keepalive

# Prevents the Supabase free-tier project from being paused after 7 days
# of database inactivity. Runs a trivial read query four times a day.

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'   # every 6 hours at :17 past - 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:          # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: main         # SUPABASE_URL / SUPABASE_KEY are environment secrets
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TABLE: matches
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_KEY resolved empty - check the 'main' environment secrets"
            exit 1
          fi

          status=$(curl -sS -o /tmp/out.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY") || status="000"

          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/out.txt
          echo ""

          if [ "$status" -ne 200 ]; then
            echo "::error::Keepalive ping failed with HTTP $status - the project is NOT protected from pausing"
            exit 1
          fi

          echo "Keepalive ping succeeded - database activity registered"
